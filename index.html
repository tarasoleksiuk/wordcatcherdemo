<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Word Catcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(to bottom, #87ceeb, #dff6ff);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: clamp(28px, 7vw, 48px);
      font-weight: 900;
      color: #1a1a2e;
    }

    .tagline {
      font-size: clamp(12px, 2.8vw, 15px);
      color: rgba(0, 0, 0, 0.45);
      margin-top: 4px;
    }

    .section-title {
      font-size: clamp(11px, 2.5vw, 14px);
      text-transform: uppercase;
      letter-spacing: 3px;
      color: rgba(0, 0, 0, 0.4);
    }

    .how-to-play {
      font-size: 12px;
      color: rgba(0, 0, 0, 0.4);
      text-decoration: none;
      border: 1px solid rgba(0, 0, 0, 0.18);
      border-radius: 20px;
      padding: 3px 12px;
      background: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      width: 100%;
      max-width: 560px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      box-shadow: 0 3px 7px rgba(0, 0, 0, 0.11);
      color: #222;
      text-align: center;
      transition: transform 0.15s, box-shadow 0.15s;
      user-select: none;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-width: 130px;
      flex: 1 1 130px;
      max-width: 200px;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
    }

    .card:active {
      transform: scale(1.02);
    }

    .card-title {
      font-size: clamp(15px, 4vw, 19px);
      font-weight: bold;
    }

    .card-subtitle {
      font-size: clamp(10px, 2.3vw, 12px);
      color: #999;
      font-style: italic;
    }

    .card-count {
      font-size: clamp(10px, 2.3vw, 12px);
      color: #aaa;
      margin-top: 2px;
    }

    #loading {
      color: rgba(0, 0, 0, 0.4);
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">Word 😀 <span>Catcher</span></div>
    <div class="tagline">Catch the right word. Learn English grammar. Enjoy yourself!</div>
  </div>

  <div style="text-align:center;margin-bottom:8px;">
    <a href="help.html" class="how-to-play">📖 How to Play</a>
  </div>
  <div class="section-title" style="text-align:center;margin-bottom:14px;">Choose a lesson</div>

  <div class="grid" id="grid">
    <div id="loading">Loading topics...</div>
  </div>

  <script>
    function formatName(filename) {
      return filename.replace(/-/g, ' ').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    fetch('questions/index.json')
      .then(r => r.json())
      .then(topics => {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        topics.forEach(t => {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = `game.html?topic=${t.file}`;
          card.innerHTML = `
        <div class="card-title">${formatName(t.file)}</div>
        ${t.subtitle ? `<div class="card-subtitle">${t.subtitle}</div>` : ''}
        <div class="card-count">${t.count ? t.count + ' questions' : 'coming soon'}</div>
      `;
          grid.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById('loading').textContent = 'Could not load topics.';
      });
  </script>
</body>

</html>
