<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Word Catcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(to bottom, #87ceeb, #dff6ff);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: clamp(28px, 7vw, 48px);
      font-weight: 900;
      color: #1a1a2e;
    }

    .tagline {
      font-size: clamp(12px, 2.8vw, 15px);
      color: rgba(0, 0, 0, 0.45);
      margin-top: 4px;
    }

    .section-title {
      font-size: clamp(11px, 2.5vw, 14px);
      text-transform: uppercase;
      letter-spacing: 3px;
      color: rgba(0, 0, 0, 0.4);
    }

    .how-to-play {
      font-size: 12px;
      color: rgba(0, 0, 0, 0.4);
      text-decoration: none;
      border: 1px solid rgba(0, 0, 0, 0.18);
      border-radius: 20px;
      padding: 3px 12px;
      background: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      width: 100%;
      max-width: 560px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      box-shadow: 0 3px 7px rgba(0, 0, 0, 0.11);
      color: #222;
      text-align: center;
      transition: transform 0.15s, box-shadow 0.15s;
      user-select: none;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-width: 130px;
      flex: 1 1 130px;
      max-width: 200px;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
    }

    .card:active {
      transform: scale(1.02);
    }

    .card-title {
      font-size: clamp(15px, 4vw, 19px);
      font-weight: bold;
    }

    .card-subtitle {
      font-size: clamp(10px, 2.3vw, 12px);
      color: #999;
      font-style: italic;
    }

    .card-count {
      font-size: clamp(10px, 2.3vw, 12px);
      color: #aaa;
      margin-top: 2px;
    }

    #loading {
      color: rgba(0, 0, 0, 0.4);
      font-size: 14px;
    }

    body.night {
      background: linear-gradient(to bottom, #0d1b2a, #1b2e45);
    }

    body.night .logo {
      color: #cde;
    }

    body.night .logo span {
      color: #cde;
    }

    body.night .tagline {
      color: rgba(180, 210, 240, 0.5);
    }

    body.night .section-title {
      color: rgba(180, 210, 240, 0.35);
    }

    body.night .card {
      background: #1e3a5f;
      color: #e8f4ff;
      box-shadow: 0 3px 7px rgba(0, 0, 0, 0.4);
    }

    body.night .card:hover {
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
    }

    body.night .card-subtitle {
      color: rgba(180, 210, 240, 0.5);
    }

    body.night .card-count {
      color: rgba(180, 210, 240, 0.35);
    }

    body.night .how-to-play {
      color: rgba(180, 210, 240, 0.45);
      border-color: rgba(180, 210, 240, 0.2);
      background: rgba(255, 255, 255, 0.05);
    }

    body.night .footer {
      color: rgba(180, 210, 240, 0.25);
    }

    #nightToggle {
      position: fixed;
      top: 12px;
      right: 14px;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
      z-index: 100;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">Word 😀 <span>Catcher</span></div>
    <div class="tagline">Catch the right word. Learn English grammar. Enjoy yourself!</div>
  </div>

  <div style="text-align:center;margin-bottom:8px;">
    <a href="help.html" class="how-to-play">📖 How to Play</a>
  </div>
  <div class="section-title" style="text-align:center;margin-bottom:14px;">Choose a lesson</div>

  <div class="grid" id="grid">
    <div id="loading">Loading topics...</div>
  </div>

  <script>
    function formatName(filename) {
      return filename.replace(/-/g, ' ').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    fetch('questions/index.json')
      .then(r => r.json())
      .then(topics => {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        topics.forEach(t => {
          // Create card immediately with loading count
          const card = document.createElement('a');
          card.className = 'card';
          card.href = `game.html?topic=${t.file}`;
          const countEl = document.createElement('div');
          countEl.className = 'card-count';
          countEl.textContent = '...';
          card.innerHTML = `
        <div class="card-title">${formatName(t.file)}</div>
        ${t.subtitle ? `<div class="card-subtitle">${t.subtitle}</div>` : ''}
      `;
          card.appendChild(countEl);
          grid.appendChild(card);

          // Load actual count from JSON file
          fetch(`questions/${t.file}.json`)
            .then(r => r.json())
            .then(questions => {
              countEl.textContent = questions.length + ' questions';
            })
            .catch(() => {
              countEl.textContent = 'coming soon';
            });
        });
      })
      .catch(() => {
        document.getElementById('loading').textContent = 'Could not load topics.';
      });
  </script>
  <div id="nightToggle">☀️</div>
  <script>
    let nightMode = sessionStorage.getItem("nightMode") === "true";
    function applyNight() {
      document.body.classList.toggle("night", nightMode);
      document.getElementById("nightToggle").textContent = nightMode ? "🌙" : "☀️";
    }
    document.getElementById("nightToggle").addEventListener("click", () => {
      nightMode = !nightMode;
      sessionStorage.setItem("nightMode", nightMode);
      applyNight();
    });
    applyNight();
  </script>
</body>

</html>
